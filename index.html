<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's Flunch</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: #0b0a2e;
            color: #f7f3ea;
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: #110c41;
            padding: 28px;
            text-align: center;
            border-radius: 16px;
            border: 1px solid #2a2c77;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
            min-height: 20rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            margin: 0 0 18px;
            color: #fffaf0;
            font-size: 34px;
            line-height: 1;
            letter-spacing: 0;
        }

        .roller {
            display: grid;
            gap: 2px;
            width: 100%;
            min-height: 132px;
            margin: 10px 0 18px;
            padding: 8px 14px;
            border-radius: 12px;
            background: #0b0a2e;
            border: 1px solid #2a2c77;
            overflow: hidden;
            transition: min-height 180ms ease, margin 180ms ease, padding 180ms ease;
        }

        .roller.is-hidden {
            display: none;
        }

        .roller.is-settled {
            min-height: 94px;
            margin: 4px 0 10px;
            padding: 4px 14px;
        }

        .slot {
            min-height: 42px;
            display: grid;
            place-items: center;
            color: #6b6b85;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.05;
            transition: color 150ms ease, font-size 150ms ease, min-height 180ms ease, transform 150ms ease;
        }

        .slot.selected {
            color: #fffdf7;
            font-size: 40px;
            transform: scale(1.03);
            text-shadow: 0 2px 18px rgba(255, 222, 132, 0.18);
        }

        .roller.is-settled .slot {
            min-height: 28px;
            font-size: 17px;
        }

        .roller.is-settled .slot.selected {
            font-size: 30px;
        }

        #genBtn {
            width: 100%;
            background: #dbaa36;
            color: #0b0a2e;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(241, 196, 91, 0.18);
            transition: transform 120ms ease, background 120ms ease, opacity 120ms ease;
        }

        #genBtn:hover {
            background: #ffd36f;
        }

        #genBtn:disabled {
            cursor: wait;
            opacity: 0.7;
            transform: none;
        }

        .selection-image {
            display: none;
            width: auto;
            max-width: 100%;
            max-height: min(46vh, 360px);
            height: auto;
            object-fit: contain;
            border-radius: 14px;
            margin: 8px auto 18px;
        }

        @media (max-width: 420px) {
            .card {
                padding: 22px;
            }

            h1 {
                font-size: 30px;
            }

            .slot.selected {
                font-size: 34px;
            }

            .selection-image {
                max-height: min(42vh, 300px);
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="title">Whats Flunch</h1>
        <div class="roller is-hidden" id="roller">
            <div class="slot" id="previousPlace"></div>
            <div class="slot selected" id="selectedPlace"></div>
            <div class="slot" id="nextPlace"></div>
        </div>
        <img class="selection-image" id="selectionImage" alt="">
        <button id="genBtn">No one can decide</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
